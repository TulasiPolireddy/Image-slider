<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Slider</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="slider-container">
    <!-- Slides -->
    <div class="slide active">
      <img src="https://picsum.photos/id/1018/1000/600" alt="Slide 1">
      <div class="caption">Slide 1: Beautiful Landscape</div>
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1015/1000/600" alt="Slide 2">
      <div class="caption">Slide 2: River Canyon</div>
    </div>
    <div class="slide">
      <img src="https://picsum.photos/id/1019/1000/600" alt="Slide 3">
      <div class="caption">Slide 3: Ocean Waves</div>
    </div>

    <!-- Navigation Buttons -->
    <button class="nav-btn prev-btn" id="prevBtn">&#10094;</button>
    <button class="nav-btn next-btn" id="nextBtn">&#10095;</button>

    <!-- Indicator Dots -->
    <div class="dots-container" id="dotsContainer"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
