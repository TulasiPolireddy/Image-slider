<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Image Slider</title>
  <style>
    /* Reset basic styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* Slider Container */
    .slider-container {
      position: relative;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      overflow: hidden;
    }

    /* Track containing the slides */
    .slider {
      display: flex;
      aspect-ratio: 16 / 9;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
      /* Hide scrollbar */
      scrollbar-width: none; /* Firefox */
    }

    .slider::-webkit-scrollbar {
      display: none; /* Chrome, Safari, Edge */
    }

    /* Individual Slide */
    .slide {
      flex: 1 0 100%;
      scroll-snap-align: start;
      position: relative;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* Caption Overlay */
    .caption {
      position: absolute;
      bottom: 40px;
      left: 20px;
      right: 20px;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      padding: 12px 18px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    .caption h3 {
      font-size: 1.2rem;
      margin-bottom: 4px;
    }

    .caption p {
      font-size: 0.9rem;
      color: #ddd;
    }

    /* Navigation Dots */
    .slider-nav {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    .slider-nav a {
      width: 12px;
      height: 12px;
      background-color: rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      text-decoration: none;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .slider-nav a:hover {
      background-color: #fff;
      transform: scale(1.2);
    }
  </style>
</head>
<body>

  <div class="slider-container">
    
    <!-- Slides Track -->
    <div class="slider">
      
      <!-- Slide 1 -->
      <div class="slide" id="slide-1">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=1000&auto=format&fit=crop" alt="Mountain Landscape">
        <div class="caption">
          <h3>Mountain River</h3>
          <p>A serene view of nature at its finest.</p>
        </div>
      </div>

      <!-- Slide 2 -->
      <div class="slide" id="slide-2">
        <img src="https://images.unsplash.com/photo-1511497584788-87676104235f?w=1000&auto=format&fit=crop" alt="Foggy Forest">
        <div class="caption">
          <h3>Misty Forest</h3>
          <p>Deep green woods surrounded by mist.</p>
        </div>
      </div>

      <!-- Slide 3 -->
      <div class="slide" id="slide-3">
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=1000&auto=format&fit=crop" alt="Tropical Beach">
        <div class="caption">
          <h3>Tropical Beach</h3>
          <p>Golden sands and clear turquoise water.</p>
        </div>
      </div>

    </div>

    <!-- Navigation Dots -->
    <div class="slider-nav">
      <a href="#slide-1" aria-label="Go to Slide 1"></a>
      <a href="#slide-2" aria-label="Go to Slide 2"></a>
      <a href="#slide-3" aria-label="Go to Slide 3"></a>
    </div>

  </div>

</body>
</html>
